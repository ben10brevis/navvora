<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b16">
  <meta name="description" content="Find available Navvora movie editions and file details.">
  <title>Find your edition · Navvora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="file-page">
  <header class="file-header">
    <a class="brand" href="index.html">NAVVORA <span>CINEMA</span></a>
    <a class="join" href="https://t.me/navvoratelugu" target="_blank" rel="noopener noreferrer">COMMUNITY ↗</a>
  </header>
  <main class="file-shell">
    <a class="back-link" href="index.html">← BACK TO DISCOVER</a>
    <section class="file-hero">
      <div class="file-backdrop" id="fileBackdrop"></div>
      <div class="file-poster-wrap"><img id="filePoster" alt="Movie poster" /></div>
      <div class="file-hero-copy">
        <span class="file-eyebrow">YOUR MOVIE · YOUR EDITION</span>
        <h1 id="movieTitle">Finding your movie…</h1>
        <p id="fileIntro">Checking the Navvora catalogue for available editions.</p>
        <div class="file-status" id="fileStatus"><span class="file-pulse"></span> CONNECTING TO CATALOGUE</div>
      </div>
      <div class="file-orbit" aria-hidden="true"><span>NV</span><i></i><b></b></div>
    </section>
    <section class="edition-section">
      <div class="edition-heading">
        <div><span class="file-eyebrow">AVAILABLE EDITIONS</span><h2>Choose your version</h2></div>
        <span class="edition-count" id="editionCount">—</span>
      </div>
      <div class="edition-list" id="editionList">
        <div class="edition-skeleton"></div><div class="edition-skeleton"></div>
      </div>
    </section>
    <footer class="file-footer">NAVVORA · STORIES, SORTED YOUR WAY</footer>
  </main>
  <script src="files.js"></script>
</body>
</html>
